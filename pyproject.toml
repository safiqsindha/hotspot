[project]
name = "hotspot"
version = "0.2.0"
description = "Procedural point-and-click worlds with a solver, a renderer, and an agent harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Clients use the stdlib. The extra exists so `pip install -e ".[llm]"` is the documented install.
llm = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hotspot*"]

[tool.setuptools.package-data]
hotspot = ["llm/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
